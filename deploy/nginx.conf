server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type text/html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Preserve the existing clean URLs such as /system and /roi-rechner.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long-lived caching only for fingerprintable/static assets.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
